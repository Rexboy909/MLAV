[package]
name = "MLAV"
version = "0.1.0"
edition = "2024"

[dependencies]
cpal = "0.17.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
lofty = "0.22"
macroquad = "0.4.14"
miniquad = "0.4.8"
once_cell = "1.18"
rfd = "0.15"
rodio = { version = "0.22.2", features = ["wav", "flac", "mp3"] }
rustfft = "6.2"

[build-dependencies]
winres = "0.1"
