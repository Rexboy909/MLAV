name: Release

on:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: MLAV-linux-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: MLAV-windows-x64.exe
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: MLAV-macos-intel
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: MLAV-macos-arm

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux audio + musl deps
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libasound2-dev libx11-dev libxi-dev libgl1-mesa-dev

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      # Rename the cargo output to the desired artifact name before uploading
      - name: Rename binary (Unix)
        if: matrix.os != 'windows-latest'
        run: cp target/${{ matrix.target }}/release/MLAV ${{ matrix.artifact }}

      - name: Rename binary (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: Copy-Item "target\${{ matrix.target }}\release\MLAV.exe" "${{ matrix.artifact }}"

      - name: Upload to release
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ matrix.artifact }}